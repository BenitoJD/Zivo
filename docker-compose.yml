# Local dev dependencies only (Postgres + MinIO + PgBouncer).
# API and workers run on the host via ./scripts/dev.sh — same pattern as zivo.
# Production deploys to K3s on the VPS (see infra/k8s/).
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: zivo-postgres
    environment:
      POSTGRES_USER: zivo
      POSTGRES_PASSWORD: zivo
      POSTGRES_DB: zivo
    ports:
      - "5455:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zivo"]
      interval: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:1.22.1-p0
    container_name: zivo-pgbouncer
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: zivo
      DB_PASSWORD: zivo
      DB_NAME: zivo
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 10
      AUTH_TYPE: scram-sha-256
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: zivo-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: zivo
      MINIO_ROOT_PASSWORD: zivo-secret
    ports:
      - "9020:9000"
      - "9021:9001"
    volumes:
      - minio:/data

  # --- Judge0 code-execution sandbox (interview coding rounds) --------------------
  # Adapted from Judge0's official compose. API on :2358. Workers run untrusted code,
  # so they need privileged + cgroup access (dev only — prod hardening is in the Helm chart).
  # Start just these: docker compose up -d judge0-db judge0-redis judge0-server judge0-workers
  judge0-db:
    image: postgres:16-alpine
    container_name: zivo-judge0-db
    environment:
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
      POSTGRES_DB: judge0
    volumes:
      - judge0-db:/var/lib/postgresql/data

  judge0-redis:
    image: redis:7-alpine
    container_name: zivo-judge0-redis
    command: ["redis-server", "--requirepass", "judge0", "--appendonly", "no"]

  judge0-server:
    image: judge0/judge0:1.13.1
    container_name: zivo-judge0-server
    ports:
      - "2358:2358"
    environment:
      REDIS_HOST: judge0-redis
      REDIS_PASSWORD: judge0
      POSTGRES_HOST: judge0-db
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
      ENABLE_NETWORK: "false"
    depends_on:
      - judge0-db
      - judge0-redis
    restart: unless-stopped

  judge0-workers:
    image: judge0/judge0:1.13.1
    container_name: zivo-judge0-workers
    command: ["./scripts/workers"]
    privileged: true
    environment:
      REDIS_HOST: judge0-redis
      REDIS_PASSWORD: judge0
      POSTGRES_HOST: judge0-db
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
      ENABLE_NETWORK: "false"
    depends_on:
      - judge0-server
    restart: unless-stopped

volumes:
  pgdata:
  minio:
  judge0-db:
