# Local dev dependencies only (Postgres + MinIO + PgBouncer).
# API and workers run on the host via ./scripts/dev.sh — same pattern as zivo.
# Production deploys to K3s on the VPS (see infra/k8s/).
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: zivo-postgres
    environment:
      POSTGRES_USER: zivo
      POSTGRES_PASSWORD: zivo
      POSTGRES_DB: zivo
    ports:
      - "5455:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zivo"]
      interval: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:1.22.1-p0
    container_name: zivo-pgbouncer
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: zivo
      DB_PASSWORD: zivo
      DB_NAME: zivo
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 10
      AUTH_TYPE: scram-sha-256
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: zivo-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: zivo
      MINIO_ROOT_PASSWORD: zivo-secret
    ports:
      - "9020:9000"
      - "9021:9001"
    volumes:
      - minio:/data

  # --- coderunner code-execution sandbox (interview coding rounds) ----------------
  # k8s-native runner (rlimits + no-net). API on :2358. Start: docker compose up -d coderunner
  coderunner:
    build: ./backend/coderunner
    container_name: zivo-coderunner
    ports:
      - "2358:2358"
    restart: unless-stopped

volumes:
  pgdata:
  minio:
