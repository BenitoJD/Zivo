# Local dev dependencies only (Postgres + MinIO).
# API and workers run on the host via ./scripts/dev.sh — same pattern as citepage.
# Production deploys to K3s on the VPS (see infra/k8s/).
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: zivo-postgres
    environment:
      POSTGRES_USER: zivo
      POSTGRES_PASSWORD: zivo
      POSTGRES_DB: zivo
    ports:
      - "5455:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zivo"]
      interval: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: zivo-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: zivo
      MINIO_ROOT_PASSWORD: zivo-secret
    ports:
      - "9020:9000"
      - "9021:9001"
    volumes:
      - minio:/data

volumes:
  pgdata:
  minio:
