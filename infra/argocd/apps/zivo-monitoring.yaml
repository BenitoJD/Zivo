apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zivo-monitoring
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 89.2.4
      helm:
        releaseName: zivo-monitoring
        valueFiles:
          - $values/infra/k8s/environments/prod/monitoring-values.yaml
    - repoURL: https://github.com/BenitoJD/Zivo.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  ignoreDifferences:
    # HPAs and Prometheus-operator-managed replicas; git must not fight them.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
