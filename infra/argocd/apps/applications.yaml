---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zivo-postgres
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/BenitoJD/Zivo.git
    targetRevision: main
    path: infra/k8s/charts/postgres
    helm:
      releaseName: zivo-postgres
      valueFiles:
        - $values/infra/k8s/environments/prod/postgres-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: zivo
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true

