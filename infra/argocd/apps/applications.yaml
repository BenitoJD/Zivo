---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zivo-worker-io
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/BenitoJD/Zivo.git
    targetRevision: main
    path: infra/k8s/charts/worker
    helm:
      releaseName: zivo-worker-io
      valueFiles:
        - $values/infra/k8s/environments/prod/worker-values.yaml
      parameters:
        # image.tag lives in worker-values.yaml; the deploy workflow's promote
        # step rewrites it per release. Pinning it here froze workers on an
        # old tag while every other service moved.
        - name: image.repository
          value: ghcr.io/benitojd/zivo-worker
        - name: workloads.io.enabled
          value: "true"
        - name: workloads.cpu.enabled
          value: "false"
        - name: workloads.newspaper.enabled
          value: "false"
  destination:
    server: https://kubernetes.default.svc
    namespace: zivo
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zivo-worker-cpu
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/BenitoJD/Zivo.git
    targetRevision: main
    path: infra/k8s/charts/worker
    helm:
      releaseName: zivo-worker-cpu
      valueFiles:
        - $values/infra/k8s/environments/prod/worker-values.yaml
      parameters:
        # image.tag lives in worker-values.yaml; the deploy workflow's promote
        # step rewrites it per release. Pinning it here froze workers on an
        # old tag while every other service moved.
        - name: image.repository
          value: ghcr.io/benitojd/zivo-worker
        - name: workloads.io.enabled
          value: "false"
        - name: workloads.cpu.enabled
          value: "true"
        - name: workloads.newspaper.enabled
          value: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: zivo
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true

