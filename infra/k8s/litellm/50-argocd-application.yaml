apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/BenitoJD/Zivo.git
    targetRevision: main
    path: infra/k8s/litellm
  destination:
    server: https://kubernetes.default.svc
    namespace: zivo
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
