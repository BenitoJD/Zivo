apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: zivo
  labels: {app: litellm-redis}
spec:
  replicas: 1
  selector: {matchLabels: {app: litellm-redis}}
  template:
    metadata: {labels: {app: litellm-redis}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: zivo
spec:
  selector: {app: litellm-redis}
  ports:
    - port: 6379
      targetPort: 6379
