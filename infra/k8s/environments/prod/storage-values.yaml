replicaCount: 2
namespace: zivo
image:
  repository: ghcr.io/benitojd/zivo-storage
  tag: Zivo_0.1.381
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-pull
service:
  port: 8000
ingress:
  enabled: true
  className: traefik
  host: storage.zivo.fyi
  # HTTP only until storage.zivo.fyi has an A record; same ACME trap as auth.
  tls: true
  entrypoint: websecure
  tlsSecret: zivo-storage-tls
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: "500m"
    memory: 256Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80
podDisruptionBudget:
  enabled: true
  minAvailable: 1
