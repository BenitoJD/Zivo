replicaCount: 2
namespace: zivo
image:
  repository: ghcr.io/benitojd/zivo-api
  tag: Zivo_0.1.58
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-cred
service:
  port: 8000
ingress:
  enabled: true
  className: traefik
  host: api.zivo.fyi
  tls: true
  entrypoint: websecure
resources:
  requests:
    cpu: 100m
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 2Gi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80
podDisruptionBudget:
  enabled: true
  minAvailable: 1
