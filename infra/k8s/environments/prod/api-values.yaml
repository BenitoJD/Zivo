replicaCount: 2
namespace: zivo
image:
  repository: ghcr.io/benitojd/zivo-api
  tag: Zivo_0.1.122
  pullPolicy: IfNotPresent
# Images are built on the VPS and imported into k3s containerd before rollout
# (pullPolicy IfNotPresent), so no registry pull happens — no pull secret needed.
# A ref to a nonexistent secret only spams FailedToRetrieveImagePullSecret.
imagePullSecrets: []
service:
  port: 8000
ingress:
  enabled: true
  className: traefik
  host: api.zivo.fyi
  tls: true
  entrypoint: websecure
resources:
  requests:
    cpu: 100m
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 2Gi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80
podDisruptionBudget:
  enabled: true
  minAvailable: 1
