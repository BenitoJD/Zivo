replicaCount: 1
namespace: zivo
image:
  repository: ghcr.io/benitojd/zivo-api
  tag: Zivo_0.1.11
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-cred
service:
  port: 8000
ingress:
  enabled: true
  className: traefik
  host: api.zivo.fyi
  tls: true
  entrypoint: websecure
resources:
  requests:
    cpu: 100m
    memory: 1Gi
