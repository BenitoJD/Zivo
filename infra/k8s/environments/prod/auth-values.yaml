replicaCount: 2
namespace: zivo
image:
  repository: ghcr.io/benitojd/zivo-auth
  tag: Zivo_0.1.381
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-pull
service:
  port: 8000
ingress:
  enabled: true
  className: traefik
  host: auth.zivo.fyi
  # HTTP only until auth.zivo.fyi has an A record; cert-manager cannot issue TLS
  # while DNS is NXDOMAIN, and the ACME solver pod fights the auth rollout.
  tls: true
  entrypoint: websecure
  tlsSecret: zivo-auth-tls
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    # bcrypt logins are CPU-heavy; 500m throttled each login to 3-7s.
    cpu: "1"
    memory: 1Gi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 80
podDisruptionBudget:
  enabled: true
  minAvailable: 1
