replicaCount: 1
namespace: zivo
image:
  repository: ghcr.io/benitojd/zivo-study
  tag: 0.0.2
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-pull
service:
  port: 8000
ingress:
  enabled: true
  className: traefik
  host: study.zivo.fyi
  # HTTP only until study.zivo.fyi has an A record; same ACME trap as auth/storage.
  tls: true
  entrypoint: websecure
  tlsSecret: zivo-study-tls
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1536Mi
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 80
podDisruptionBudget:
  enabled: false
  minAvailable: 1
