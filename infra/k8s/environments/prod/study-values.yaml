replicaCount: 1
namespace: zivo
image:
  repository: ghcr.io/benitojd/zivo-study
  tag: Zivo_0.1.364
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-pull
service:
  port: 8000
ingress:
  enabled: true
  className: traefik
  host: study.zivo.fyi
  # HTTP only until study.zivo.fyi has an A record; same ACME trap as auth/storage.
  tls: false
  entrypoint: web
  tlsSecret: zivo-study-tls
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1536Mi
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 80
podDisruptionBudget:
  enabled: true
  minAvailable: 1
