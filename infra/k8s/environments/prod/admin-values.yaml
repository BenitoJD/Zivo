replicaCount: 1
namespace: zivo
image:
  repository: ghcr.io/benitojd/zivo-admin
  tag: 0.0.1
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-pull
service:
  port: 8000
ingress:
  enabled: true
  className: traefik
  host: admin.zivo.fyi
  # HTTP only until admin.zivo.fyi has an A record; same ACME trap as auth/storage.
  tls: true
  entrypoint: websecure
  tlsSecret: zivo-admin-tls
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: "500m"
    memory: 1Gi
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80
podDisruptionBudget:
  enabled: true
  minAvailable: 1
