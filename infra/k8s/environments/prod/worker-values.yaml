namespace: zivo
replicaCount: 2
image:
  repository: ghcr.io/benitojd/zivo-worker
  tag: Zivo_0.1.376
  pullPolicy: IfNotPresent
secretName: zivo-secrets
# Images are built on the VPS and imported into k3s containerd before rollout
# (pullPolicy IfNotPresent), so no registry pull happens — no pull secret needed.
# A ref to a nonexistent secret only spams FailedToRetrieveImagePullSecret.
imagePullSecrets: []
workloads:
  io:
    enabled: true
    replicaCount: 2
    command: ["python", "run_eta_worker_async.py"]
    env:
      ETA_WORKER_WORKLOADS: io
      STORAGE_URL: http://zivo-storage:8000
  cpu:
    enabled: true
    command: ["python", "run_eta_worker_cpu.py"]
    env:
      ETA_WORKER_WORKLOADS: cpu
      STORAGE_URL: http://zivo-storage:8000
  newspaper:
    # Telethon → MyBookZon; The Hindu allowlist; LLM paper-id.
    # Requires TELEGRAM_* in zivo-secrets + channel_ref in DB.
    enabled: true
    replicaCount: 1
    command: ["python", "run_newspaper_ingest.py"]
    env:
      STORAGE_URL: http://zivo-storage:8000
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi
autoscaling:
  enabled: true
  # CPU workers use ~1.2Gi each; keep headroom for Traefik, Postgres, and k3s.
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80
podDisruptionBudget:
  enabled: true
  minAvailable: 1
