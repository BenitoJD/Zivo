namespace: zivo
replicaCount: 1

image:
  repository: ghcr.io/benitojd/zivo-api
  tag: Zivo_0.1.5
  pullPolicy: IfNotPresent

secretName: zivo-secrets

imagePullSecrets:
  - name: ghcr-cred

workloads:
  io:
    enabled: true
    command: ["python", "run_eta_worker_async.py"]
    env:
      ETA_WORKER_WORKLOADS: io
  cpu:
    enabled: true
    command: ["python", "run_eta_worker_cpu.py"]
    env:
      ETA_WORKER_WORKLOADS: cpu

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 2Gi
