namespace: zivo
replicaCount: 2
image:
  repository: ghcr.io/benitojd/zivo-api
  tag: Zivo_0.1.233
  pullPolicy: IfNotPresent
secretName: zivo-secrets
# Images are built on the VPS and imported into k3s containerd before rollout
# (pullPolicy IfNotPresent), so no registry pull happens — no pull secret needed.
# A ref to a nonexistent secret only spams FailedToRetrieveImagePullSecret.
imagePullSecrets: []
workloads:
  io:
    enabled: true
    replicaCount: 3
    command: ["python", "run_eta_worker_async.py"]
    env:
      ETA_WORKER_WORKLOADS: io
  cpu:
    enabled: true
    command: ["python", "run_eta_worker_cpu.py"]
    env:
      ETA_WORKER_WORKLOADS: cpu
  newspaper:
    # Telethon → MyBookZon; The Hindu allowlist; LLM paper-id.
    # Requires TELEGRAM_* in zivo-secrets + channel_ref in DB.
    enabled: true
    replicaCount: 1
    command: ["python", "run_newspaper_ingest.py"]
    env: {}
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80
podDisruptionBudget:
  enabled: true
  minAvailable: 1
