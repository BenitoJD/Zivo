replicaCount: 1
namespace: zivo
image:
  repository: ghcr.io/benitojd/zivo-library
  tag: Zivo_0.1.375
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-pull
service:
  port: 8000
ingress:
  enabled: true
  className: traefik
  host: library.zivo.fyi
  # HTTP only until library.zivo.fyi has an A record; same ACME trap as auth/storage.
  tls: true
  entrypoint: websecure
  tlsSecret: zivo-library-tls
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: "500m"
    memory: 512Mi
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80
podDisruptionBudget:
  enabled: true
  minAvailable: 1
