replicaCount: 1
namespace: zivo
image:
  repository: ghcr.io/benitojd/zivo-practice
  tag: 0.0.2
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-pull
service:
  port: 8000
ingress:
  enabled: true
  className: traefik
  host: practice.zivo.fyi
  # HTTP only until practice.zivo.fyi has an A record; same ACME trap as auth/storage.
  tls: true
  entrypoint: websecure
  tlsSecret: zivo-practice-tls
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: "500m"
    memory: 1Gi
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 80
podDisruptionBudget:
  enabled: false
  minAvailable: 1
