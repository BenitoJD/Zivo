replicaCount: 1
namespace: zivo
image:
  repository: ghcr.io/benitojd/zivo-practice
  tag: Zivo_0.1.364
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-pull
service:
  port: 8000
ingress:
  enabled: true
  className: traefik
  host: practice.zivo.fyi
  # HTTP only until practice.zivo.fyi has an A record; same ACME trap as auth/storage.
  tls: false
  entrypoint: web
  tlsSecret: zivo-practice-tls
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: "500m"
    memory: 512Mi
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80
podDisruptionBudget:
  enabled: true
  minAvailable: 1
