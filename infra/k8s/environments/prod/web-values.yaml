replicaCount: 2
namespace: zivo
image:
  repository: ghcr.io/benitojd/zivo-web
  tag: Zivo_0.1.154
  pullPolicy: IfNotPresent
# Images are built on the VPS and imported into k3s containerd before rollout
# (pullPolicy IfNotPresent), so no registry pull happens — no pull secret needed.
# A ref to a nonexistent secret only spams FailedToRetrieveImagePullSecret.
imagePullSecrets: []
service:
  port: 80
ingress:
  enabled: true
  className: traefik
  host: zivo.fyi
  wwwHost: www.zivo.fyi
  tls: true
  entrypoint: websecure
resources:
  requests:
    cpu: 50m
    memory: 256Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80
podDisruptionBudget:
  enabled: true
  minAvailable: 1
