replicaCount: 1
namespace: zivo
image:
  repository: ghcr.io/benitojd/zivo-web
  tag: Zivo_0.1.361
  pullPolicy: IfNotPresent
# Images are built on the VPS and imported into k3s containerd before rollout
# (pullPolicy IfNotPresent), so no registry pull happens — no pull secret needed.
# A ref to a nonexistent secret only spams FailedToRetrieveImagePullSecret.
imagePullSecrets: []
service:
  port: 80
env:
  - name: API_PROXY_URL
    value: http://zivo-api:8000
  - name: AUTH_PROXY_URL
    value: http://zivo-auth:8000
  - name: STORAGE_PROXY_URL
    value: http://zivo-storage:8000
  - name: PRACTICE_PROXY_URL
    value: http://zivo-practice:8000
  - name: CONTENT_PROXY_URL
    value: http://zivo-content:8000
  - name: STUDY_PROXY_URL
    value: http://zivo-study:8000
  - name: LIBRARY_PROXY_URL
    value: http://zivo-library:8000
  - name: ADMIN_PROXY_URL
    value: http://zivo-admin:8000
  - name: NEXT_PUBLIC_API_URL
    value: https://api.zivo.fyi
  # Empty until auth.zivo.fyi and storage.zivo.fyi A records exist. Next bakes
  # NEXT_PUBLIC_* at image build; empty keeps /api/auth and /api/storage on
  # zivo.fyi rewrites to in-cluster zivo-auth / zivo-storage. Practice/content/study
  # / library / admin hostnames are NXDOMAIN too, so they stay on apex rewrites.
  - name: NEXT_PUBLIC_AUTH_URL
    value: ""
  - name: NEXT_PUBLIC_STORAGE_URL
    value: ""
ingress:
  enabled: true
  className: traefik
  host: zivo.fyi
  wwwHost: www.zivo.fyi
  tls: true
  entrypoint: websecure
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi
autoscaling:
  enabled: true
  # Single 12GB VPS: cap web replicas so Traefik stays healthy under load.
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80
podDisruptionBudget:
  enabled: true
  minAvailable: 1
