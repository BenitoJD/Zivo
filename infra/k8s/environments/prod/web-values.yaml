replicaCount: 1
namespace: zivo
image:
  repository: ghcr.io/benitojd/zivo-web
  tag: Zivo_0.1.325
  pullPolicy: IfNotPresent
# Images are built on the VPS and imported into k3s containerd before rollout
# (pullPolicy IfNotPresent), so no registry pull happens — no pull secret needed.
# A ref to a nonexistent secret only spams FailedToRetrieveImagePullSecret.
imagePullSecrets: []
service:
  port: 80
env:
  - name: API_PROXY_URL
    value: http://zivo-api:8000
  - name: NEXT_PUBLIC_API_URL
    value: https://api.zivo.fyi
ingress:
  enabled: true
  className: traefik
  host: zivo.fyi
  wwwHost: www.zivo.fyi
  tls: true
  entrypoint: websecure
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi
autoscaling:
  enabled: true
  # Single 12GB VPS: cap web replicas so Traefik stays healthy under load.
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80
podDisruptionBudget:
  enabled: true
  minAvailable: 1
