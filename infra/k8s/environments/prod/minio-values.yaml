namespace: zivo
image: minio/minio:RELEASE.2023-03-20T20-16-18Z
storage: 40Gi
ingress:
  enabled: true
  className: traefik
  host: s3.zivo.fyi
  # HTTP until the deliberate TLS cutover (cert-manager needs every host A
  # record live; flipping this on is the cutover step itself).
  tls: false
  entrypoint: web
  tlsSecret: zivo-s3-tls
publicUrl: http://s3.zivo.fyi

# Dedicated data node: tainted node.zivo/dedicated=data so ONLY postgres/minio
# schedule here. See infra/SERVERS.md (zivo-node2 = vm326035110).
nodeSelector:
  kubernetes.io/hostname: worker-2
tolerations:
  - key: node.zivo/dedicated
    operator: Equal
    value: data
    effect: NoSchedule
