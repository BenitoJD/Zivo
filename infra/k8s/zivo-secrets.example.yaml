# Example Kubernetes secret keys for Zivo (do not commit real values).
# kubectl -n zivo create secret generic zivo-secrets --from-literal=...
#
# Apps (API + workers) should use PgBouncer:
#   DATABASE_URL=postgresql+psycopg://zivo:SECRET@pgbouncer:5432/zivo
#
# Alembic migration job uses direct Postgres (see db-schema chart):
#   DATABASE_URL_DIRECT=postgresql+psycopg://zivo:SECRET@postgres:5432/zivo
apiVersion: v1
kind: Secret
metadata:
  name: zivo-secrets
  namespace: zivo
type: Opaque
stringData:
  POSTGRES_USER: zivo
  POSTGRES_PASSWORD: change-me
  DATABASE_URL: postgresql+psycopg://zivo:change-me@pgbouncer:5432/zivo
  DATABASE_URL_DIRECT: postgresql+psycopg://zivo:change-me@postgres:5432/zivo
  SECRET_KEY: change-me
  CSRF_SECRET: change-me
  # Trusted reverse-proxy IPs/CIDRs for X-Forwarded-For parsing + rate limiting.
  # Behind K3s/Traefik, set this to the pod CIDR so client_ip() sees real clients
  # instead of the Traefik pod IP. K3s default pod CIDR is 10.42.0.0/16.
  TRUSTED_PROXY_IPS: 10.42.0.0/16
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: change-me
  MINIO_SECRET_KEY: change-me
  # LLM providers — StepFun step-3.7-flash is the default; others are pool/failover members.
  LITELLM_MODEL: openai/step-3.7-flash
  LLM_POOL_ENABLED: "true"
  DEEPSEEK_API_KEY: change-me
  DEEPSEEK_API_BASE: https://api.deepseek.com/v1
  ZAI_API_KEY: ""
  STEPFUN_API_KEY: ""
  OPENROUTER_API_KEY: ""
  # Offline Mode (ADR 0006) — signed, server-tracked study packs. On = the
  # "Prepare offline pack" affordance works and packs ship answer keys to the
  # learner's own browser (short-lived + HMAC-signed). Off = endpoint 404s.
  OFFLINE_MODE_ENABLED: "true"
  OFFLINE_PACK_TTL_DAYS: "7"
  # Audiobook Engine — local Piper TTS (open-source, CPU-only, no API cost).
  # On = /api/audiobook works and sources get a "Listen" player. piper_bin is
  # the venv CLI ("python -m piper" works too); voices ship baked into the
  # image at /app/piper_voices.
  AUDIOBOOK_ENABLED: "false"
  PIPER_BIN: "python -m piper"
  PIPER_VOICES_DIR: "/app/piper_voices"
  # Newspaper ingest (Telethon) — enable worker.newspaper when set + channel_ref
  # at /workspace/newspaper (MyBookZon ENGLISH (PREMIUM) peer id).
  TELEGRAM_API_ID: ""
  TELEGRAM_API_HASH: ""
  TELEGRAM_SESSION: ""
  # Google OAuth — redirect URI must match the host the browser uses for /api
  # (Next rewrite on zivo.fyi). Cookie Domain is derived from FRONTEND_URL so
  # apex + www share zivo_session (or set COOKIE_DOMAIN=zivo.fyi explicitly).
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  GOOGLE_REDIRECT_URI: https://zivo.fyi/api/auth/google/callback
  FRONTEND_URL: https://zivo.fyi
  # COOKIE_DOMAIN: zivo.fyi
