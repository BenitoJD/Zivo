# Example Kubernetes secret keys for Zivo (do not commit real values).
# kubectl -n zivo create secret generic zivo-secrets --from-literal=...
#
# Apps (API + workers) should use PgBouncer:
#   DATABASE_URL=postgresql+psycopg://zivo:SECRET@pgbouncer:5432/zivo
#
# Alembic migration job uses direct Postgres (see db-schema chart):
#   DATABASE_URL_DIRECT=postgresql+psycopg://zivo:SECRET@postgres:5432/zivo
apiVersion: v1
kind: Secret
metadata:
  name: zivo-secrets
  namespace: zivo
type: Opaque
stringData:
  POSTGRES_USER: zivo
  POSTGRES_PASSWORD: change-me
  DATABASE_URL: postgresql+psycopg://zivo:change-me@pgbouncer:5432/zivo
  DATABASE_URL_DIRECT: postgresql+psycopg://zivo:change-me@postgres:5432/zivo
  SECRET_KEY: change-me
  CSRF_SECRET: change-me
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: change-me
  MINIO_SECRET_KEY: change-me
  # LLM providers — DeepSeek is the default; others are pool/failover members.
  LITELLM_MODEL: openai/deepseek-v4-flash
  LLM_POOL_ENABLED: "true"
  DEEPSEEK_API_KEY: change-me
  DEEPSEEK_API_BASE: https://api.deepseek.com/v1
  ZAI_API_KEY: ""
  STEPFUN_API_KEY: ""
  OPENROUTER_API_KEY: ""
