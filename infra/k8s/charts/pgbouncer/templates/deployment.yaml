apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      containers:
        - name: pgbouncer
          image: {{ .Values.image }}
          ports:
            - containerPort: 5432
          env:
            - name: DB_HOST
              value: {{ .Values.postgresHost | quote }}
            - name: DB_PORT
              value: {{ .Values.postgresPort | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: zivo-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zivo-secrets
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              value: zivo
            - name: POOL_MODE
              value: {{ .Values.poolMode | quote }}
            - name: MAX_CLIENT_CONN
              value: {{ .Values.maxClientConn | quote }}
            - name: DEFAULT_POOL_SIZE
              value: {{ .Values.defaultPoolSize | quote }}
            - name: AUTH_TYPE
              value: scram-sha-256
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: pgbouncer
  ports:
    - port: 5432
      targetPort: 5432
