apiVersion: apps/v1
kind: Deployment
metadata:
  name: coderunner
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: coderunner
  template:
    metadata:
      labels:
        app: coderunner
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coderunner
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python3", "/app/app.py"]
          ports:
            - containerPort: 2358
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: TMPDIR
              value: /tmp
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /health, port: 2358 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 2358 }
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: work
              mountPath: /tmp
      volumes:
        # Writable scratch for submissions (root FS is read-only). Bounded so it can't fill the node.
        - name: work
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: coderunner
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: coderunner
  ports:
    - port: 2358
      targetPort: 2358
