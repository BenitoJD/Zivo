namespace: coderunner

image:
  repository: ghcr.io/benitojd/zivo-coderunner
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

# Memory limit is the k8s backstop above the per-submission RLIMIT_AS (512Mi × up to 4 concurrent).
resources:
  requests: { cpu: "100m", memory: "256Mi" }
  limits: { cpu: "1", memory: "2Gi" }

env:
  RUN_CPU_SECONDS: "5"
  # 2Gi RLIMIT_AS (virtual): compilers (cc1plus) + Node need >512Mi VSZ just to start.
  # Physical use stays low; the pod memory limit is the real backstop.
  RUN_MEM_BYTES: "2147483648"
  RUN_NPROC: "256"                # compilers fork; Node uses worker threads
  RUN_MAX_CONCURRENCY: "4"
