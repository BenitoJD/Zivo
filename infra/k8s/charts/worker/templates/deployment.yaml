{{- range $name, $wl := .Values.workloads }}
{{- if $wl.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Chart.Name }}-{{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "worker.labels" $ | nindent 4 }}
    workload: {{ $name }}
spec:
  replicas: {{ $wl.replicaCount | default $.Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: {{ $.Chart.Name }}-{{ $name }}
  template:
    metadata:
      labels:
        app: {{ $.Chart.Name }}-{{ $name }}
        workload: {{ $name }}
        app.kubernetes.io/component: worker
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Give in-flight jobs up to 120s to finish on SIGTERM (rolling deploy /
      # HPA scale-down / eviction) before K8s sends SIGKILL. The worker's
      # graceful-drain stops reserving new work and waits for handlers to exit;
      # anything still running after this becomes reclaimable once its lease
      # expires (~ETA_STALE_THRESHOLD_SECONDS, default 90s).
      terminationGracePeriodSeconds: 120
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: {{ $.Chart.Name }}-{{ $name }}
                topologyKey: kubernetes.io/hostname
      containers:
        - name: worker
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: {{ $wl.command | toJson }}
          envFrom:
            - secretRef:
                name: {{ $.Values.secretName }}
          env:
            {{- range $k, $v := $wl.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          livenessProbe:
            exec:
              command: ["pgrep", "-f", {{ index $wl.command 1 | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["pgrep", "-f", {{ index $wl.command 1 | quote }}]
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          {{- with $wl.resources | default $.Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
{{- end }}
