replicaCount: 1
namespace: zivo

image:
  repository: ghcr.io/benitojd/zivo-worker
  tag: latest
  pullPolicy: IfNotPresent

secretName: zivo-secrets
imagePullSecrets: []

workloads:
  io:
    enabled: true
    command: ["python", "run_eta_worker_async.py"]
    env:
      ETA_WORKER_WORKLOADS: io
      STORAGE_URL: http://zivo-storage:8000
  cpu:
    enabled: true
    command: ["python", "run_eta_worker_cpu.py"]
    env:
      ETA_WORKER_WORKLOADS: cpu
      STORAGE_URL: http://zivo-storage:8000
  newspaper:
    enabled: false
    command: ["python", "run_newspaper_ingest.py"]
    env:
      STORAGE_URL: http://zivo-storage:8000

resources: {}

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1
