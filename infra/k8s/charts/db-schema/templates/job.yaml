apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.jobName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "db-schema.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.ttlSecondsAfterFinished }}
  activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "db-schema.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: schema
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python"]
          args:
            - scripts/run_alembic_with_lock.py
            - --revision
            - head
            - --timeout-seconds
            - {{ .Values.migration.timeoutSeconds | quote }}
            - --lock-timeout-seconds
            - {{ .Values.migration.lockTimeoutSeconds | quote }}
            {{- if .Values.migration.verifyHead }}
            - --verify-head
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: {{ .Values.migration.databaseUrlSecretKey | default "DATABASE_URL" }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
