namespace: zivo
jobName: alembic-migrate
ttlSecondsAfterFinished: 600
backoffLimit: 2
activeDeadlineSeconds: 900

image:
  repository: ghcr.io/benitojd/zivo-migrate
  tag: latest
  pullPolicy: IfNotPresent

# Images are built on the VPS and imported into k3s containerd before rollout
# (pullPolicy IfNotPresent), so no registry pull happens — no pull secret needed.
imagePullSecrets: []

secretName: zivo-secrets

migration:
  timeoutSeconds: 600
  lockTimeoutSeconds: 120
  verifyHead: true
  # Alembic uses advisory locks — connect to Postgres directly, not PgBouncer.
  databaseUrlSecretKey: DATABASE_URL_DIRECT

resources:
  requests:
    cpu: 50m
    memory: 128Mi
