namespace: zivo
jobName: alembic-migrate
ttlSecondsAfterFinished: 600
backoffLimit: 2
activeDeadlineSeconds: 900

image:
  repository: ghcr.io/benitojd/zivo-api
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-cred

secretName: zivo-secrets

migration:
  timeoutSeconds: 600
  lockTimeoutSeconds: 120
  verifyHead: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
