namespace: judge0

image:
  repository: judge0/judge0
  tag: "1.13.1"
  pullPolicy: IfNotPresent

server:
  replicas: 1
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "512Mi" }

# Workers run untrusted code in the `isolate` sandbox — they REQUIRE privileged.
# Keep their footprint tight; each replica processes submissions serially.
workers:
  replicas: 1
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits: { cpu: "1", memory: "1Gi" }

postgres:
  image: postgres:16-alpine
  storage: 5Gi

redis:
  image: redis:7-alpine

# Per-submission ceilings enforced by Judge0 (an individual run can request less, never more).
limits:
  maxCpuTime: 15          # seconds
  maxWallTime: 20         # seconds
  maxMemoryKb: 256000     # 256 MB
  maxProcesses: 60
  enableNetwork: false    # sandboxed code gets NO network

# When true the chart creates judge0-secrets from the values below (dev/default).
# In prod set false and pre-create the secret manually (see README) so no credentials in git.
createSecret: true
secrets:
  postgresUser: judge0
  postgresPassword: judge0-change-me
  postgresDb: judge0
  redisPassword: judge0-redis-change-me
