apiVersion: apps/v1
kind: Deployment
metadata:
  name: judge0-server
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      app: judge0-server
  template:
    metadata:
      labels:
        app: judge0-server
    spec:
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Default entrypoint runs the Rails API. The server does NOT execute code
          # (only workers do), so it needs no privilege.
          envFrom:
            - configMapRef:
                name: judge0-config
            - secretRef:
                name: judge0-secrets
          ports:
            - containerPort: 2358
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: 2358
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: 2358
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: judge0-server
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: judge0-server
  ports:
    - port: 2358
      targetPort: 2358
