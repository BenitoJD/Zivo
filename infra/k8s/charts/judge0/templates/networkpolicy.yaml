# Hardening for the judge0 namespace. Judge0 workers run untrusted code with privileged
# containers, so we constrain the blast radius at the network layer:
#   1. default-deny all ingress + egress in the namespace
#   2. allow only DNS egress (so services can resolve each other)
#   3. allow judge0-server + workers → in-namespace postgres/redis
#   4. allow the Zivo namespace → judge0-server:2358 (the only way in)
# Net effect: untrusted code cannot reach the Zivo DB, the app, or the public internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: judge0-default-deny
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: judge0-allow-dns
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# judge0-server + workers may reach the in-namespace postgres and redis only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: judge0-egress-datastores
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["judge0-server", "judge0-workers"]
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: judge0-db
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: judge0-redis
      ports:
        - protocol: TCP
          port: 6379
---
# postgres + redis accept connections only from server/workers in this namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: judge0-datastores-ingress
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["judge0-db", "judge0-redis"]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["judge0-server", "judge0-workers"]
---
# The ONLY ingress into judge0: the Zivo namespace → judge0-server:2358.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: judge0-server-ingress
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: judge0-server
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: zivo
      ports:
        - protocol: TCP
          port: 2358
