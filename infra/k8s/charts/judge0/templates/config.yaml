{{- if .Values.createSecret }}
# Dev/default only. In prod set createSecret=false and pre-create judge0-secrets
# (same pattern as zivo-secrets) so credentials never live in git.
apiVersion: v1
kind: Secret
metadata:
  name: judge0-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  POSTGRES_DB: {{ .Values.secrets.postgresDb | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: judge0-config
  namespace: {{ .Values.namespace }}
data:
  # Judge0 reads these as environment variables (envFrom below).
  REDIS_HOST: "judge0-redis"
  REDIS_PORT: "6379"
  POSTGRES_HOST: "judge0-db"
  POSTGRES_PORT: "5432"
  # Per-submission ceilings.
  MAX_CPU_TIME_LIMIT: {{ .Values.limits.maxCpuTime | quote }}
  MAX_WALL_TIME_LIMIT: {{ .Values.limits.maxWallTime | quote }}
  MAX_MEMORY_LIMIT: {{ .Values.limits.maxMemoryKb | quote }}
  MAX_PROCESSES_AND_OR_THREADS: {{ .Values.limits.maxProcesses | quote }}
  ENABLE_NETWORK: {{ .Values.limits.enableNetwork | quote }}
  # No callbacks / batching surface we don't use.
  ENABLE_WAIT_RESULT: "true"
  ENABLE_COMPILER_OPTIONS: "true"
