replicaCount: 1
namespace: zivo

image:
  repository: ghcr.io/benitojd/zivo-web
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  port: 80

# Server-side /api fetches from RSC (learn blog, sitemap). Override in prod.
env:
  - name: API_PROXY_URL
    value: http://zivo-api:8000
  - name: AUTH_PROXY_URL
    value: http://zivo-auth:8000
  - name: STORAGE_PROXY_URL
    value: http://zivo-storage:8000
  - name: PRACTICE_PROXY_URL
    value: http://zivo-practice:8000
  - name: CONTENT_PROXY_URL
    value: http://zivo-content:8000
  - name: STUDY_PROXY_URL
    value: http://zivo-study:8000
  - name: LIBRARY_PROXY_URL
    value: http://zivo-library:8000
  - name: ADMIN_PROXY_URL
    value: http://zivo-admin:8000
  - name: NEXT_PUBLIC_API_URL
    value: https://api.zivo.fyi

ingress:
  enabled: false
  className: traefik
  host: example.com
  wwwHost: www.example.com
  tls: true
  entrypoint: websecure

resources: {}

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1
