# Ingress policies for Zivo workloads — apply with kubectl apply -f infra/k8s/charts/network-policy.yaml
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zivo-api-ingress
  namespace: zivo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zivo-web-ingress
  namespace: zivo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zivo-workers-egress-db
  namespace: zivo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: worker
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: pgbouncer
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: zivo-storage
      ports:
        - protocol: TCP
          port: 8000
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zivo-storage-ingress
  namespace: zivo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: storage
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: worker
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: web
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: study
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zivo-practice-ingress
  namespace: zivo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: practice
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: web
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zivo-content-ingress
  namespace: zivo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: content
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: web
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zivo-study-ingress
  namespace: zivo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: study
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: web

