[defaults]
pipelining = True
inventory = inventory/hosts.ini
roles_path = roles
host_key_checking = False
interpreter_python = auto_silent
forks = 7
retry_files_enabled = False
timeout = 30
# Kill any module that outlives its expected duration (25 min); helm's own
# --timeout bounds each release, cluster_verify sets longer per task.
command_timeout = 1500
# The inventory uses raw IPs, so ~/.ssh/config Host aliases never apply; point
# Ansible at the fleet key explicitly (see infra/SERVERS.md). Teammates without
# that key: override with --private-key or install your own key on the servers.
private_key_file = ~/.ssh/zivo_fleet_ed25519
