# HA Kubernetes cluster inventory: 3 masters, 3 workers, 2 load balancers.
# IPs are the live fleet as of 2026-09-01; see infra/SERVERS.md for the full survey.
# Map to ssh aliases: master-1..3 = zivo-node6..8, worker-1..3 = zivo-node1..3,
# master-lb = zivo-node5, app-lb-1 = zivo-lb1.
# zivo-node4 (203.57.85.251) hosts only the GitHub Actions CI runner; it was
# removed from the cluster and kubeadm-reset on 2026-09-14, so it stays under
# [ci_runner] (never [workers]) while keeping the `hosts: worker-4` plays
# resolvable. zivo-node5 (45.196.196.22) is the API LB host / Judge0 sandbox.
# ansible_user=root uses the fleet key (~/.ssh/zivo_fleet_ed25519); root needs no sudo.

[masters]
master-1 ansible_host=203.57.85.250
master-2 ansible_host=203.57.85.224
master-3 ansible_host=203.57.85.157

[workers]
worker-1 ansible_host=45.196.196.52
worker-2 ansible_host=45.196.196.115
worker-3 ansible_host=45.196.196.191

[ci_runner]
worker-4 ansible_host=203.57.85.251

[sandbox]
worker-5 ansible_host=45.196.196.22

[load_balancer]
master-lb ansible_host=45.196.196.233

[app_load_balancer]
app-lb-1 ansible_host=45.196.196.98

[k8s_nodes:children]
masters
workers

[cluster:children]
k8s_nodes
load_balancer

[cluster:vars]


[all:vars]
ansible_user=root
