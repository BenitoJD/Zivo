# HA Kubernetes cluster inventory: 3 masters, 3 workers, 1 dedicated HAProxy load balancer.
# Replace every ansible_host placeholder with the real VM address.
# ansible_user must have sudo on the VMs (passwordless, or pass --ask-become-pass).

[masters]
master-1 ansible_host=10.0.0.11
master-2 ansible_host=10.0.0.12
master-3 ansible_host=10.0.0.13

[workers]
worker-1 ansible_host=10.0.0.21
worker-2 ansible_host=10.0.0.22
worker-3 ansible_host=10.0.0.23

[load_balancer]
master-lb ansible_host=10.0.0.10

[k8s_nodes:children]
masters
workers

[cluster:children]
k8s_nodes
load_balancer

[all:vars]
ansible_user=ubuntu
