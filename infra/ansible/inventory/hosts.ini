# HA Kubernetes cluster inventory: 3 masters, 3 workers, 2 load balancers.
# IPs are the live fleet as of 2026-09-01; see infra/SERVERS.md for the full survey.
# Naming: inventory names for cluster nodes match the kubernetes node names
# (master-1..3, worker-1..3). Non-cluster machines get role names:
#   runner-1  = zivo-node4  / zivo-runner-1  dedicated GitHub Actions CI runner
#   sandbox-1 = zivo-node5  / zivo-spare-1   Judge0 sandbox + Uptime Kuma
# They live under [ci_runner] / [sandbox], never [workers], so k8s plays
# skip them while their own plays (`hosts: runner-1`) still resolve.
# ansible_user=root uses the fleet key (~/.ssh/zivo_fleet_ed25519); root needs no sudo.

[masters]
master-1 ansible_host=203.57.85.250
master-2 ansible_host=203.57.85.224
master-3 ansible_host=203.57.85.157

[workers]
worker-1 ansible_host=45.196.196.52
worker-2 ansible_host=45.196.196.115
worker-3 ansible_host=45.196.196.191

[ci_runner]
runner-1 ansible_host=203.57.85.251

[sandbox]
sandbox-1 ansible_host=45.196.196.22

[load_balancer]
master-lb ansible_host=45.196.196.233

[app_load_balancer]
app-lb-1 ansible_host=45.196.196.98

[k8s_nodes:children]
masters
workers

[cluster:children]
k8s_nodes
load_balancer

[cluster:vars]


[all:vars]
ansible_user=root
