# HA Kubernetes cluster inventory: 3 masters, 3 workers, 1 dedicated HAProxy load balancer.
# IPs are the live fleet as of 2026-09-01; see infra/SERVERS.md for the full survey.
# Map to ssh aliases: master-1..3 = zivo-node6..8, worker-1..3 = zivo-node1..3,
# master-lb = zivo-node5. zivo-node4 (203.57.85.251) is the spare, not part of the cluster.
# ansible_user=root uses the fleet key (~/.ssh/zivo_fleet_ed25519); root needs no sudo.

[masters]
master-1 ansible_host=203.57.85.250
master-2 ansible_host=203.57.85.224
master-3 ansible_host=203.57.85.157

[workers]
worker-1 ansible_host=45.196.196.52
worker-2 ansible_host=45.196.196.115
worker-3 ansible_host=45.196.196.191

[load_balancer]
master-lb ansible_host=45.196.196.22

[k8s_nodes:children]
masters
workers

[cluster:children]
k8s_nodes
load_balancer

[all:vars]
ansible_user=root
