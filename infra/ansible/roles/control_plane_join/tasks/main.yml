---
# Step 14: join this node as a control-plane member. Runs with serial: 1 so the
# etcd members are added one at a time (master-2, then master-3).
# The join command and certificate key come from the control_plane_init role via
# hostvars['master-1'].

- name: Check whether this master has already joined
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf

- name: Join as a control-plane node (Step 14)
  # --certificate-key expires after 2 hours; the control_plane_init play refreshes
  # the uploaded certs on every re-run, so this always has a live key.
  ansible.builtin.shell: "{{ hostvars['master-1'].control_plane_join_command }}"
  args:
    creates: /etc/kubernetes/kubelet.conf
  register: cp_join_out
  when: not kubelet_conf.stat.exists
  vars:
    ansible_command_timeout: 1800

- name: Ensure ~/.kube exists on this master
  ansible.builtin.file:
    path: /home/{{ ansible_user }}/.kube
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0750"

- name: Configure kubectl on this master (end of Step 14)
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    remote_src: true
    dest: /home/{{ ansible_user }}/.kube/config
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

- name: Wait for this master to appear as Ready
  ansible.builtin.command: kubectl wait --for=condition=Ready node/{{ k8s_node_name }} --timeout=900s
  become: false
  register: cp_ready_out
  until: cp_ready_out.rc == 0
  retries: 20
  delay: 10
  changed_when: false
