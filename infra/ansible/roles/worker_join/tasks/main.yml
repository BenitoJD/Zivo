---
# Step 15: plain worker join (no --control-plane). Workers get no kubeconfig;
# they talk to the API through the load balancer via their own kubelet identity.

- name: Check whether this worker has already joined
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf

- name: Mint a fresh worker join command on master-1
  ansible.builtin.shell: kubeadm token create --print-join-command
  register: worker_join_cmd
  delegate_to: master-1
  become: false
  changed_when: false

- name: Join the cluster (Step 15)
  ansible.builtin.shell: "{{ worker_join_cmd.stdout }}"
  args:
    creates: /etc/kubernetes/kubelet.conf
  when: not kubelet_conf.stat.exists
  vars:
    ansible_command_timeout: 1800
