---
# The runner shares a 4GB box with production pods; docker builds spike past
# free RAM and the kernel OOM killer starts shooting pods. A swapfile absorbs
# build spikes; the fstab line makes it survive reimages.
- name: Swap file for build memory spikes
  ansible.builtin.shell: |
    if [ ! -f /swapfile ]; then
      fallocate -l 4G /swapfile && chmod 600 /swapfile && mkswap /swapfile >/dev/null
      echo '/swapfile none swap sw 0 0' >> /etc/fstab
    fi
    swapon /swapfile 2>/dev/null || true
  changed_when: false

- name: Install docker + buildx plugin (BuildKit cache mounts need buildx)
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-buildx
    state: present
    update_cache: true

- name: Enable docker
  ansible.builtin.systemd: { name: docker, enabled: true, state: started }

- name: Create runner user
  ansible.builtin.user: { name: github-runner, shell: /bin/bash, create_home: true }

- name: Docker group for runner user
  ansible.builtin.user: { name: github-runner, groups: docker, append: true }

- name: Fetch runner registration token (controller, via gh)
  ansible.builtin.command: gh api --method POST repos/{{ gh_repo }}/actions/runners/registration-token --jq .token
  delegate_to: localhost
  become: false
  register: reg_token
  changed_when: false

- name: Set runner token fact
  ansible.builtin.set_fact:
    runner_token: "{{ reg_token.stdout }}"

- name: Download and configure the runner
  become_user: github-runner
  ansible.builtin.shell: |
    set -e
    cd /home/github-runner
    [ -d actions-runner ] && exit 0
    curl -fsSL -o runner.tar.gz https://github.com/actions/runner/releases/download/v2.323.0/actions-runner-linux-x64-2.323.0.tar.gz
    tar xzf runner.tar.gz && rm runner.tar.gz
    ./config.sh --url https://github.com/{{ gh_repo }} --token {{ runner_token }} --labels {{ runner_labels }} --unattended --replace
  args: { creates: /home/github-runner/.credentials }

- name: Install and start the runner service (as root; unit runs as github-runner)
  ansible.builtin.shell: cd /home/github-runner && ./svc.sh install github-runner && ./svc.sh start
  args:
    chdir: /home/github-runner
    creates: /etc/systemd/system/actions.runner.BenitoJD-Zivo.worker-4.service
  changed_when: true

- name: Read admin.conf from master-1
  ansible.builtin.command: cat /etc/kubernetes/admin.conf
  register: admin_conf
  delegate_to: master-1
  become: false
  changed_when: false
  no_log: true

- name: Kubeconfig dir for the runner user
  ansible.builtin.file:
    path: /home/github-runner/.kube
    state: directory
    owner: github-runner
    group: github-runner
    mode: "0750"

- name: Kubeconfig for CI deploys (cluster-admin via API LB)
  ansible.builtin.copy:
    content: "{{ admin_conf.stdout }}\n"
    dest: /home/github-runner/.kube/config
    owner: github-runner
    group: github-runner
    mode: "0600"
