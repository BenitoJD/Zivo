---
# Part 1, Steps 4-6 of the guide: containerd v2.3.3 (LTS branch, binary install),
# runc v1.4.3, CNI plugins v1.9.1. Runs on all 6 Kubernetes nodes.

- name: Install download prerequisites
  ansible.builtin.apt:
    name: [curl, ca-certificates]
    state: present
    update_cache: true

- name: Download containerd v{{ containerd_version }}
  ansible.builtin.get_url:
    url: https://github.com/containerd/containerd/releases/download/v{{ containerd_version }}/containerd-{{ containerd_version }}-linux-amd64.tar.gz
    dest: /tmp/containerd-{{ containerd_version }}-linux-amd64.tar.gz
    mode: "0644"
    timeout: 300

- name: Extract containerd to /usr/local (Step 4)
  ansible.builtin.unarchive:
    src: /tmp/containerd-{{ containerd_version }}-linux-amd64.tar.gz
    dest: /usr/local
    remote_src: true
    creates: /usr/local/bin/containerd

- name: Ensure /usr/local/lib/systemd/system exists
  ansible.builtin.file:
    path: /usr/local/lib/systemd/system
    state: directory
    mode: "0755"

- name: Download the containerd systemd unit
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/containerd/containerd/v{{ containerd_version }}/containerd.service
    dest: /usr/local/lib/systemd/system/containerd.service
    mode: "0644"
    timeout: 60
  notify: Reload systemd

- name: Ensure /etc/containerd exists
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"

- name: Generate the default containerd config
  # Only generated when missing, so the SystemdCgroup edit below is never overwritten.
  # containerd 2.x prints "SystemdCgroup = false" under the
  # plugins.'io.containerd.cri.v1.runtime' runc options table.
  ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
  args:
    creates: /etc/containerd/config.toml

- name: Switch the runc options table to the systemd cgroup driver
  # Plain substitution of the existing line: TOML forbids duplicate keys in one table,
  # so never insert a second SystemdCgroup line.
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'
  notify: Restart containerd

- name: Confirm the systemd cgroup driver is configured
  ansible.builtin.command: grep "SystemdCgroup = true" /etc/containerd/config.toml
  changed_when: false

- name: Enable and start containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started

- name: Download runc v{{ runc_version }}
  ansible.builtin.get_url:
    url: https://github.com/opencontainers/runc/releases/download/v{{ runc_version }}/runc.amd64
    dest: /tmp/runc.amd64
    mode: "0644"
    timeout: 300

- name: Check the installed runc version
  ansible.builtin.command: /usr/local/sbin/runc --version
  register: runc_installed
  changed_when: false
  failed_when: false

- name: Install runc to /usr/local/sbin (Step 5)
  ansible.builtin.copy:
    src: /tmp/runc.amd64
    dest: /usr/local/sbin/runc
    remote_src: true
    mode: "0755"
  when: runc_installed.stdout is not search('version ' + runc_version)

- name: Ensure /opt/cni/bin exists
  ansible.builtin.file:
    path: /opt/cni/bin
    state: directory
    mode: "0755"

- name: Download CNI plugins {{ cni_plugins_version }}
  ansible.builtin.get_url:
    url: https://github.com/containernetworking/plugins/releases/download/{{ cni_plugins_version }}/cni-plugins-linux-amd64-{{ cni_plugins_version }}.tgz
    dest: /tmp/cni-plugins-linux-amd64-{{ cni_plugins_version }}.tgz
    mode: "0644"
    timeout: 300

- name: Extract CNI plugins to /opt/cni/bin (Step 6)
  ansible.builtin.unarchive:
    src: /tmp/cni-plugins-linux-amd64-{{ cni_plugins_version }}.tgz
    dest: /opt/cni/bin
    remote_src: true
    creates: /opt/cni/bin/loopback

- name: Confirm containerd runs the pinned version
  ansible.builtin.command: containerd --version
  register: containerd_version_check
  changed_when: false
  failed_when: containerd_version_check.stdout is not search('v' + containerd_version)

- name: Confirm containerd is active (running)
  ansible.builtin.systemd:
    name: containerd
    state: started
