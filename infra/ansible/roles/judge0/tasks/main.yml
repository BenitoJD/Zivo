---
- name: Install docker + compose
  ansible.builtin.apt:
    name: [docker.io, docker-compose-v2, unzip]
    state: present
    update_cache: true

- name: Enable docker
  ansible.builtin.systemd: { name: docker, enabled: true, state: started }

- name: Create judge0 directory
  ansible.builtin.file: { path: /opt/judge0, state: directory, mode: "0755" }

- name: Download Judge0 release bundle
  ansible.builtin.get_url:
    url: https://github.com/judge0/judge0/releases/download/v1.13.0/judge0-v1.13.0.zip
    dest: /opt/judge0/judge0.zip
    mode: "0644"
    timeout: 300

- name: Extract
  ansible.builtin.unarchive:
    src: /opt/judge0/judge0.zip
    dest: /opt/judge0
    remote_src: true
    creates: /opt/judge0/judge0-1.13.0/docker-compose.yml

- name: Judge0 config sanity (shipped judge0.conf holds db/redis defaults)
  ansible.builtin.command: grep -q "POSTGRES" /opt/judge0/judge0-v1.13.0/judge0.conf
  changed_when: false

- name: Check Judge0 server container
  ansible.builtin.shell: docker ps --format '{{.Names}}' | grep -q judge0-v1130-server-1
  register: j0_running
  failed_when: false
  changed_when: false

- name: Start Judge0 stack
  when: j0_running.rc != 0
  ansible.builtin.command: docker compose -f docker-compose.yml up -d
  args: { chdir: /opt/judge0/judge0-1.13.0 }
  changed_when: true
