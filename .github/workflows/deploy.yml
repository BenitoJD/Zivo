name: Deploy Zivo

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: false
        default: main

permissions:
  contents: write

concurrency:
  group: deploy-zivo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, zivo]
    timeout-minutes: 60
    env:
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - id: tag
        run: echo "image_tag=Zivo_0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build and deploy on VPS
        run: |
          chmod +x scripts/deploy-vps-local-build.sh scripts/promote-prod-image-tags.sh
          REPO="${{ github.workspace }}" bash scripts/deploy-vps-local-build.sh "${{ steps.tag.outputs.image_tag }}"

      - name: Promote image tags in git
        if: ${{ github.event.inputs.branch == '' || github.event.inputs.branch == 'main' }}
        run: |
          TAG="${{ steps.tag.outputs.image_tag }}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          ./scripts/promote-prod-image-tags.sh "${TAG}" "${OWNER}"
          yq -i ".image.tag = \"${TAG}\"" infra/k8s/environments/prod/worker-values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/k8s/environments/prod/
          git diff --staged --quiet && exit 0
          git commit -m "chore: promote ${TAG}"
          git pull --rebase origin main
          git push origin HEAD:main
