name: Deploy Zivo

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: false
        default: main
      prebuilt:
        description: Skip VPS docker build (images already in containerd/GHCR)
        required: false
        default: "0"

permissions:
  contents: write
  packages: write

concurrency:
  group: deploy-zivo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, zivo]
    timeout-minutes: 90
    env:
      # Runner lives entirely on the small Judge0 box: it builds the images, pushes them to GHCR, and
      # rolls out to the prod K3s over the network via this kubeconfig (staged to point at the prod API;
      # k3s pulls the public images from GHCR). No build or SSH runs on prod.
      KUBECONFIG: /home/github-runner/.kube/config
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - id: tag
        run: echo "image_tag=Zivo_0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build, push to GHCR, and roll out to prod
        env:
          PREBUILT: ${{ github.event.inputs.prebuilt == '1' && '1' || '0' }}
        run: |
          REPO="${{ github.workspace }}" bash scripts/deploy-vps-local-build.sh "${{ steps.tag.outputs.image_tag }}"

      - name: Promote image tags in git
        if: ${{ github.event.inputs.branch == '' || github.event.inputs.branch == 'main' }}
        run: |
          TAG="${{ steps.tag.outputs.image_tag }}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          ./scripts/promote-prod-image-tags.sh "${TAG}" "${OWNER}"
          yq -i ".image.tag = \"${TAG}\"" infra/k8s/environments/prod/worker-values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/k8s/environments/prod/
          git diff --staged --quiet && exit 0
          git commit -m "chore: promote ${TAG}"
          git pull --rebase origin main
          git push origin HEAD:main
