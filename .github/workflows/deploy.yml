name: Deploy Zivo

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: false
        default: main
      prebuilt:
        description: Skip VPS docker build (images already in containerd/GHCR)
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: deploy-zivo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, zivo]
    timeout-minutes: 60
    env:
      # The runner lives on the small Judge0 box (no k3s, too little RAM to build). It orchestrates
      # the heavy build + k3s import + helm on the prod VPS over SSH (github-runner@prod, key authorized).
      PROD_HOST: 103.194.228.47
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - id: tag
        run: echo "image_tag=Zivo_0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build and deploy on prod VPS (over SSH)
        env:
          PREBUILT: ${{ github.event.inputs.prebuilt == '1' && '1' || '0' }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 "github-runner@${PROD_HOST}" \
            "cd /opt/zivo && PREBUILT=${PREBUILT} bash scripts/deploy-vps-local-build.sh '${{ steps.tag.outputs.image_tag }}'"

      - name: Promote image tags in git
        if: ${{ github.event.inputs.branch == '' || github.event.inputs.branch == 'main' }}
        run: |
          TAG="${{ steps.tag.outputs.image_tag }}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          ./scripts/promote-prod-image-tags.sh "${TAG}" "${OWNER}"
          yq -i ".image.tag = \"${TAG}\"" infra/k8s/environments/prod/worker-values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/k8s/environments/prod/
          git diff --staged --quiet && exit 0
          git commit -m "chore: promote ${TAG}"
          git pull --rebase origin main
          git push origin HEAD:main
